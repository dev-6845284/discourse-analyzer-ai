<svg width="250" height="250" viewBox="0 0 250 250" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 1. Background (Icon Container - Electric Blue with 20% rounding) -->
    <rect width="250" height="250" rx="50" fill="#0077FF"/>

    <!-- 2. Nose Cone (Red - Z-index 10. Rotated -5 degrees around its base center) -->
    <!-- Position: x=100, y=105, width=140, height=40. Center Y for rotation: 125 -->
    <rect x="100" y="105" width="140" height="40" rx="20" fill="#FF0033" transform="rotate(-5 100 125)">
        <title>The Lying Nose</title>
        <!-- Simple shadow approximation -->
        <filter id="shadow">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF0033" flood-opacity="0.4"/>
        </filter>
    </rect>

    <!-- 3. Hat Brim (Lighter Brown - Rotated 5 degrees) -->
    <!-- Position: x=-40, y=60, width=180, height=18 -->
    <rect x="-40" y="40" width="180" height="18" rx="10" fill="#A0522D" transform="rotate(5 50 69)"/>

    <!-- 4. Face Profile (White Circle - Z-index 15) -->
    <!-- Position: cx=50, cy=125, r=75 -->
    <circle cx="50" cy="125" r="75" fill="white"/>

    <!-- 5. Hat Crown (Saddle Brown - Z-index 18. Rotated -10 degrees) -->
    <!-- Position: x=-10, y=5, width=100, height=60 -->
    <rect x="-10" y="5" width="100" height="60" rx="10" fill="#8B4513" transform="rotate(-10 40 35)"/>

    <!-- 6. Hat Band (Dark Brown Ellipse - Z-index 19. Rotated -10 degrees, centered on hat) -->
    <!-- Position: cx=35, cy=35, rx=25, ry=10 (Approximation of the hat::after element) -->
    <ellipse cx="35" cy="35" rx="25" ry="10" fill="#692F00" transform="rotate(-10 40 35)"/>

    <!-- 7. Eye (Dark Circle - Z-index 20) -->
    <!-- Position: cx=66, cy=101, r=6 -->
    <circle cx="66" cy="101" r="6" fill="#333333"/>
</svg>